<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header with Logo, Website Name, Navigation Links, and Right-Aligned Portal Links -->
    <header>
        <div class="header-content">
            <div class="logo-container">
                <img src="logo.png" alt="Website Logo" class="logo">
                <h2 class="website-name">Website Name</h2>
            </div>
            <nav class="nav-links">
                <a href="#home" class="nav-link">Home</a>
                <a href="#about" class="nav-link">About Us</a>
                <a href="#contact" class="nav-link">Contact Us</a>
            </nav>
            <div class="portal-links">
                <a href="login.html?role=student" class="portal-button">Student Portal</a>
                <a href="login.html?role=instructor" class="portal-button">Instructor Portal</a>
            </div>
        </div>
    </header>

    <!-- Main content sections (full-screen slides) -->
    <div id="home" class="section home-section">
        <!-- Background image container with text and button overlay -->
        <div class="home-content">
            <h1>Elevate Your Education</h1>
            <h2>Achieve Excellence with Us</h2>
            <a href="#about" class="read-more-button">Read More</a>
        </div>
    </div>

    <div id="about" class="section about-section">
        <h2>About Us</h2>
        <p>This is the About Us section where you can introduce your website or organization.</p>
    </div>

    <div id="contact" class="section contact-section">
        <form action="https://api.web3forms.com/submit" method="POST" class="contact-left">
            <div class="contact-left-title">
                <h2>Contact Us</h2>
                <hr>
            </div>
            <input type="hidden" name="access_key" value="d56d366b-b160-4806-9bfd-5bc740d786c9">
            <input type="text" name="name" placeholder="Name" class="contact-inputs" required>
            <input type="email" name="email" placeholder="Email" class="contact-inputs" required>
            <textarea name="message" placeholder="Message" class="contact-inputs" required></textarea>
            <button type="submit">submit</button>
        </form>

        <div class="contact-right">
            <img src="./assets/contact_image.jpg" alt="">

        </div>

      </div>
      
</body>
</html>
