<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link id="role-stylesheet" rel="stylesheet" href="">
    <script defer src="script.js"></script>
</head>
<body>
    <div class="form-container">
        <h2 id="signup-title">Sign Up</h2>
        <input type="text" id="username" placeholder="Username" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button onclick="handleSignup()">Sign Up</button>
        <p>Have an account? <a id="login-link" href="#">Log In</a></p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const role = urlParams.get('role');

        // Select the appropriate stylesheet based on the role
        const stylesheet = document.getElementById('role-stylesheet');
        if (role === 'student') {
            stylesheet.href = 'student-style.css';
        } else if (role === 'instructor') {
            stylesheet.href = 'instructor-style.css';
        } else {
            stylesheet.href = 'default-style.css'; // Optional: a default style if no role is specified
        }

        const loginLink = document.getElementById('login-link');
        loginLink.href = `login.html?role=${role || 'student'}`;
    </script>
</body>
</html>
