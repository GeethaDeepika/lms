<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor Dashboard</title>
    <link rel="stylesheet" href="instructor-page-style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo-container">
                <img src="./assets/logo.jpeg" alt="Website Logo" class="logo">
                <h2 class="website-name">CourseHub</h2>
            </div>
            <div class="user-info">
                <button class="logout-btn" onclick="confirmLogout()">Logout</button>
            </div>
        </div>
    </header>

    <div class="sidebar">
        <nav>
            <ul>
                <li><a href="./instructor.html">Courses</a></li>
            </ul>
        </nav>
    </div>

    <div class="filter-bar">
        <input type="text" id="courseFilter" placeholder="Filter courses..." onkeyup="filterCourses()">
    </div>
    

    <div class="main-content">
        <button class="add-course-btn" onclick="window.location.href='add-new-course.html'">Add New Course</button>
        <h3>My Courses</h3>
        <div class="course-table-container">
            <table class="course-table">
                <thead>
                    <tr>
                        <th>Course Title</th>
                    </tr>
                </thead>
                <tbody id="course-list"></tbody> <!-- Course titles will be appended here -->
            </table>
        </div>

    </div>
    

    <script src="instructor-page-script.js"></script>
</body>
</html>
