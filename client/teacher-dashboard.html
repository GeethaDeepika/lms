<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>
    <link rel="stylesheet" href="tstyle.css">
</head>
<body>

    <div class="sidebar">
        <div class="logo">Logoipsum</div>
        <nav>
            <ul>
                <li><a href="teacher-dashboard.html">Courses</a></li>
            </ul>
        </nav>
    </div>

    <div class="content">
        <header>
            <h1>Courses</h1>
            <button class="new-course-btn">New Course</button>
        </header>

        <div class="filter-bar">
            <input type="text" id="courseFilter" placeholder="Filter courses..." onkeyup="filterCourses()">
        </div>

        <table>
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Status</th>
                    <th> </th>
                </tr>
            </thead>
            <tbody id="courseList">
                <tr>
                    <td>Cinematic Techniques</td>
                    <td><span class="status published">Published</span></td>
                    <td><button class="options">...</button></td>
                </tr>
                <tr>
                    <td>Introduction to Filming</td>
                    <td><span class="status published">Published</span></td>
                    <td><button class="options">...</button></td>
                </tr>
                <!-- Add more courses as needed -->
            </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
